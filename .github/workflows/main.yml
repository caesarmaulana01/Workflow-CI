name: Workflow CI

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

permissions:
  contents: write

env:
  DATASET_FILE: "employee_data_preprocessed.csv"
  N_ESTIMATORS: 100
  MAX_DEPTH: 10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # Check Env Variables (optional debug step)
      - name: Check Env
        run: |
          echo "Dataset file: $DATASET_FILE"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas          

      # Run MLflow Project
      - name: Run MLflow project
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P n_estimators=${{ env.N_ESTIMATORS }} \
            -P max_depth=${{ env.MAX_DEPTH }} \
            -P dataset=${{ env.DATASET_FILE }}

      # Verify model artifacts
      - name: Verify model artifacts
        run: |
          echo "Checking saved models..."
          find mlruns -name "model" -type d
          ls -R mlruns/0/*/artifacts/
          
      # Get latest run_id
      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "Latest run_id: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

          MODEL_PATH="mlruns/0/$RUN_ID/artifacts/model"
          if [ ! -d "$MODEL_PATH" ]; then
            echo "Error: Model not found at $MODEL_PATH"
            exit 1
          fi

      # Save models to GitHub Repository (replaces Git LFS)
      - name: Save mlruns to repo
        run: |
          git config --global user.name "${{ secrets.username }}"
          git config --global user.email "${{ secrets.email }}"
          git pull origin Master
          git add mlruns/
          git commit -m "Save mlruns from CI run at $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin Master
