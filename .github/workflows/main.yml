name: Workflow CI

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

permissions:
  contents: write

env:
  DATASET_FILE: "employee_data_preprocessed.csv"
  N_ESTIMATORS: 100
  MAX_DEPTH: 10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          echo "Dataset file: $DATASET_FILE"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas

      # Jalankan MLflow tanpa hapus mlruns
      - name: Run MLflow project
        run: |
          # Hapus seluruh folder mlruns jika ada
          rm -rf mlruns
          
          # Buat folder structure dari scratch
          mkdir -p mlruns/0
          
          # Buat meta.yaml dengan format yang benar
          cat > mlruns/0/meta.yaml <<EOL
          experiment_id: '0'
          name: Default
          artifact_location: file://$GITHUB_WORKSPACE/mlruns/0
          lifecycle_stage: active
          tags: {}
          EOL
          
          # Set permission yang benar
          chmod -R a+rwx mlruns
          
          echo "MLflow tracking initialized"
          ls -la mlruns/0/

      - name: Verify model artifacts
        run: |
          echo "Checking saved models..."
          find mlruns -name "model" -type d
          ls -R mlruns/0/*/artifacts/

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "Latest run_id: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

          MODEL_PATH="mlruns/0/$RUN_ID/artifacts/model"
          if [ ! -d "$MODEL_PATH" ]; then
            echo "Error: Model not found at $MODEL_PATH"
            exit 1
          fi

      - name: Save mlruns to repo
        run: |
          git config --global user.name "${{ secrets.username }}"
          git config --global user.email "${{ secrets.email }}"
          git pull origin Master
          git add mlruns/
          git commit -m "Update mlruns from CI run at $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin Master
