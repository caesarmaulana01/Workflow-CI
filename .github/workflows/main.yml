name: Workflow CI

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

permissions:
  contents: write

env:
  DATASET_FILE: "employee_data_preprocessed.csv"
  N_ESTIMATORS: 100
  MAX_DEPTH: 10
  MLFLOW_TRACKING_URI: "./mlruns"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # Check Env Variables
      - name: Check Env
        run: |
          echo "Dataset file: $DATASET_FILE"
          echo "MLflow tracking URI: $MLFLOW_TRACKING_URI"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas pyyaml
          pip list

      # Clean and initialize MLflow tracking
      - name: Initialize MLflow Tracking
        run: |
          # Remove existing mlruns directory if it exists
          rm -rf mlruns
          
          # Create fresh directory structure
          mkdir -p mlruns/0
          
          # Create basic meta.yaml file
          cat > mlruns/0/meta.yaml <<EOL
          experiment_id: '0'
          name: Default
          artifact_location: ./mlruns/0
          lifecycle_stage: active
          tags: {}
          EOL
          
          echo "MLflow tracking initialized at $MLFLOW_TRACKING_URI"
          ls -la mlruns/0/

      # Debug: Show MLproject file contents
      - name: Debug MLproject
        run: |
          echo "MLproject file contents:"
          cat MLProject/MLproject || cat MLproject
          echo ""
          echo "Directory structure:"
          ls -la

      # Run MLflow Project
      - name: Run MLflow project
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P n_estimators=${{ env.N_ESTIMATORS }} \
            -P max_depth=${{ env.MAX_DEPTH }} \
            -P dataset=${{ env.DATASET_FILE }} \
            --experiment-id 0

      - name: Verify model artifacts
        run: |
          echo "Checking saved models..."
          find mlruns -name "model" -type d
          ls -R mlruns/0/*/artifacts/
          
      # Get latest run_id
      - name: Get latest MLflow run_id
        id: get-run-id
        working-directory: .
        run: |
          # Get the latest run ID
          RUN_ID=$(ls -td mlruns/0/*/ | grep -v meta.yaml | head -n 1 | cut -d'/' -f3)
          echo "Latest run_id: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          
          # Verify model exists
          MODEL_PATH="mlruns/0/$RUN_ID/artifacts/model"
          if [ ! -d "$MODEL_PATH" ]; then
            echo "Error: Model not found at $MODEL_PATH"
            exit 1
          fi
          
      - name: Track mlruns with Git LFS and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "mlruns/**"
          git add .gitattributes
          git add mlruns/
          git checkout $GITHUB_REF_NAME
          git diff --staged --quiet || git commit -m "Track mlruns using Git LFS from CI on $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin $GITHUB_REF_NAME

      # Build Docker image with the model
      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/${{ env.RUN_ID }}/model" --name "employee-model"

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Tag the Docker image
      - name: Tag Docker Image
        run: |
          docker tag employee-model ${{ secrets.DOCKER_HUB_USERNAME }}/employee-model:latest

      # Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/employee-model:latest
