name: Workflow CI

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

permissions:
  contents: write

env:
  DATASET_FILE: "employee_data_preprocessed.csv"
  N_ESTIMATORS: 100
  MAX_DEPTH: 10
  MLFLOW_TRACKING_URI: "file://${{ github.workspace }}/mlruns"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas pyyaml
          pip list

      # Initialize MLflow tracking properly
      - name: Setup MLflow Tracking
        run: |
          # Clean existing mlruns
          rm -rf mlruns
          
          # Create fresh directory structure
          mkdir -p mlruns/0
          
          # Initialize MLflow properly
          python -c "
          import mlflow
          mlflow.set_tracking_uri('file://${{ github.workspace }}/mlruns')
          mlflow.create_experiment('Default', '${{ github.workspace }}/mlruns/0')
          "
          
          # Verify structure
          echo "MLflow tracking structure:"
          ls -la mlruns/
          ls -la mlruns/0/

      # Debug: Show files
      - name: Debug Files
        run: |
          echo "MLproject contents:"
          cat MLProject/MLproject || cat MLproject
          echo ""
          echo "Dataset file exists:"
          ls -la MLProject/employee_data_preprocessed.csv || echo "Dataset file not found"
          echo ""
          echo "modelling.py exists:"
          ls -la MLProject/modelling.py

      # Run MLflow Project with explicit tracking URI
      - name: Run MLflow project
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P n_estimators=${{ env.N_ESTIMATORS }} \
            -P max_depth=${{ env.MAX_DEPTH }} \
            -P dataset=${{ env.DATASET_FILE }} \
            --experiment-name Default

      # Get latest run_id
      - name: Get latest MLflow run_id
        id: get-run-id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | grep -v meta.yaml | head -n 1 | cut -d'/' -f4)
          echo "Latest run_id: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          
          # Verify model exists
          MODEL_PATH="mlruns/0/$RUN_ID/artifacts/model"
          if [ ! -d "$MODEL_PATH" ]; then
            echo "Error: Model not found at $MODEL_PATH"
            exit 1
          fi

      # Rest of your steps...
      - name: Track mlruns with Git LFS and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "mlruns/**"
          git add .gitattributes
          git add mlruns/
          git checkout $GITHUB_REF_NAME
          git diff --staged --quiet || git commit -m "Track mlruns using Git LFS from CI on $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin $GITHUB_REF_NAME

      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/${{ env.RUN_ID }}/model" --name "employee-model"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag employee-model ${{ secrets.DOCKER_HUB_USERNAME }}/employee-model:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/employee-model:latest
