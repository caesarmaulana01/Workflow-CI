name: Workflow CI

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

permissions:
  contents: write  

env:
  DATASET_FILE: "employee_data_preprocessed.csv"
  N_ESTIMATORS: 100
  MAX_DEPTH: 10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn xgboost pandas

      - name: Run MLflow Project
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P n_estimators=${{ env.N_ESTIMATORS }} \
            -P max_depth=${{ env.MAX_DEPTH }} \
            -P dataset=${{ env.DATASET_FILE }}

      - name: Save mlruns to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout $GITHUB_REF_NAME
          git add mlruns/
          
          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "Add mlruns from CI run on $(date +'%Y-%m-%d %H:%M:%S')"
          
          git push origin $GITHUB_REF_NAME
