name: Workflow CI

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

env:
  DATASET_FILE: "employee_data_preprocessed.csv"
  N_ESTIMATORS: 100
  MAX_DEPTH: 10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v3

      # Setup Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow dagshub scikit-learn xgboost pandas

      # Run MLflow project with parameters
      - name: Run MLflow Project
        run: |
          mlflow run . \
            --env-manager=local \
            -P n_estimators=${{ env.N_ESTIMATORS }} \
            -P max_depth=${{ env.MAX_DEPTH }} \
            -P dataset=${{ env.DATASET_FILE }}
