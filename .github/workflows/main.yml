name: Workflow CI

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

permissions:
  contents: write

env:
  DATASET_FILE: "employee_data_preprocessed.csv"
  N_ESTIMATORS: 100
  MAX_DEPTH: 10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # Check Env Variables (optional debug step)
      - name: Check Env
        run: |
          echo "Dataset file: $DATASET_FILE"
      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas
          
      - name: Verify model artifacts
        run: |
          echo "Checking saved models..."
          find mlruns -name "model" -type d
          ls -R mlruns/0/*/artifacts/
          
      # Run MLflow Project
      - name: Run MLflow project
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P n_estimators=${{ env.N_ESTIMATORS }} \
            -P max_depth=${{ env.MAX_DEPTH }} \
            -P dataset=${{ env.DATASET_FILE }}
      # Get latest run_id
      - name: Get latest MLflow run_id
        working-directory: .
        run: |
          # Get the latest run ID
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "Latest run_id: $RUN_ID"
          
          # Verify model exists
          MODEL_PATH="mlruns/0/$RUN_ID/artifacts/model"
          if [ ! -d "$MODEL_PATH" ]; then
            echo "Error: Model not found at $MODEL_PATH"
            exit 1
          fi
          
      # Build Docker Model
      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "cc"
      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Tag the Docker image
      - name: Tag Docker Image
        run: |
          docker tag cc ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
      # Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
      # Commit & push mlruns to repo (GitHub LFS)
      - name: Track mlruns with Git LFS and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "mlruns/**"
          git add .gitattributes
          git add mlruns/
          git checkout $GITHUB_REF_NAME
          git diff --staged --quiet || git commit -m "Track mlruns using Git LFS from CI on $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin $GITHUB_REF_NAME
